name: Build macOS app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.1.1) — used for filenames and Info.plist'
        required: true

permissions:
  contents: write  # needed to create the GitHub Release on tag push

jobs:
  build:
    name: macOS arm64 .app + .pkg
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version label
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="dev-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python and project deps
        run: uv sync --frozen

      - name: Build .app with PyInstaller
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          uv run --with pyinstaller pyinstaller \
            --noconfirm --clean \
            packaging/pickapicka.spec

      - name: Verify .app launches its CLI
        run: |
          APP="dist/Pickapicka.app"
          test -d "$APP"
          "$APP/Contents/MacOS/pickapicka" --help | head -3

      - name: Smoke-test that the app starts and serves
        run: |
          # --help proves the CLI imports; this proves the server comes up.
          "dist/Pickapicka.app/Contents/MacOS/pickapicka" serve --port 8799 &
          PID=$!
          OK=0
          for i in $(seq 1 120); do
            if curl -sf -m 2 http://127.0.0.1:8799/api/state > /dev/null; then OK=1; break; fi
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          test "$OK" = 1 || { echo "the app never answered on /api/state"; exit 1; }

      - name: Smoke-test scoring on Korean paths
        run: |
          # Creates and scores a project the way the UI does, with the home
          # folder, the workspace and the photos on Korean paths with spaces.
          uv run python packaging/smoke_score.py "dist/Pickapicka.app/Contents/MacOS/pickapicka"

      - name: Create .pkg installer
        run: |
          PKG="dist/Pickapicka-${{ steps.ver.outputs.tag }}-macos-arm64.pkg"
          # A component pkg that installs the .app into /Applications; opens in
          # Installer.app on double-click.
          pkgbuild \
            --install-location /Applications \
            --component "dist/Pickapicka.app" \
            --identifier kr.son-engr.pickapicka \
            --version "${{ steps.ver.outputs.version }}" \
            "$PKG"
          ls -lh "$PKG"

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pickapicka-*.pkg
          fail_on_unmatched_files: true

      - name: Upload artifact (workflow_dispatch fallback)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pickapicka-${{ steps.ver.outputs.tag }}-macos-arm64
          path: dist/Pickapicka-*.pkg
          retention-days: 14
