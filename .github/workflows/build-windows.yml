name: Build Windows app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.1.4) — used for filenames'
        required: true

permissions:
  contents: write  # needed to upload to the GitHub Release on tag push

jobs:
  build:
    name: Windows x64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version label
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="dev-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python and project deps
        run: uv sync --frozen

      - name: Build onedir bundle with PyInstaller
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: uv run --with pyinstaller pyinstaller --noconfirm --clean packaging/picture-classifier.spec

      - name: Verify the bundle
        shell: pwsh
        run: |
          # A windowed (no-console) exe has no stdout, so `--help` can't be
          # checked; verify the bundle structurally instead.
          $dir = "dist\picture-classifier"
          if (-not (Test-Path "$dir\picture-classifier.exe")) { throw "exe missing" }
          if (-not (Test-Path "$dir\_internal")) { throw "_internal/ missing" }
          if (-not (Get-ChildItem "$dir\_internal" -Recurse -Filter "onnxruntime*" -ErrorAction SilentlyContinue)) {
            throw "onnxruntime not bundled — PyInstaller missed a dependency"
          }
          $mb = [math]::Round((Get-ChildItem $dir -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          Write-Host "bundle size: $mb MB"
          if ($mb -lt 100) { throw "bundle is only $mb MB — heavy deps likely missing" }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
                  "/DRepoRoot=${{ github.workspace }}" `
                  packaging\picture-classifier.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with code $LASTEXITCODE" }
          Get-ChildItem dist\installer

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/Picture-Classifier-*.exe
          fail_on_unmatched_files: true

      - name: Upload artifact (workflow_dispatch fallback)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: picture-classifier-${{ steps.ver.outputs.tag }}-windows-x64
          path: dist/installer/Picture-Classifier-*.exe
          retention-days: 14
