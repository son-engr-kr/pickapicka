name: Build macOS app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.1.1) — used for filenames and Info.plist'
        required: true

permissions:
  contents: write  # needed to create the GitHub Release on tag push

jobs:
  build:
    name: macOS arm64 .app + .pkg
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version label
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="dev-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python and project deps
        run: uv sync --frozen

      - name: Build .app with PyInstaller
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          uv run --with pyinstaller pyinstaller \
            --noconfirm --clean \
            packaging/picture-classifier.spec

      - name: Verify .app launches its CLI
        run: |
          APP="dist/Picture Classifier.app"
          test -d "$APP"
          "$APP/Contents/MacOS/picture-classifier" --help | head -3

      - name: Create .pkg installer
        run: |
          PKG="dist/Picture-Classifier-${{ steps.ver.outputs.tag }}-macos-arm64.pkg"
          # A component pkg that installs the .app into /Applications; opens in
          # Installer.app on double-click.
          pkgbuild \
            --install-location /Applications \
            --component "dist/Picture Classifier.app" \
            --identifier kr.son-engr.picture-classifier \
            --version "${{ steps.ver.outputs.version }}" \
            "$PKG"
          ls -lh "$PKG"

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Picture-Classifier-*.pkg
          fail_on_unmatched_files: true

      - name: Upload artifact (workflow_dispatch fallback)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: picture-classifier-${{ steps.ver.outputs.tag }}-macos-arm64
          path: dist/Picture-Classifier-*.pkg
          retention-days: 14
